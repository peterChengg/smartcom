default_language_version:
  python: python3.12
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types: [python]
        stages: [pre-commit]
        args:
          - "--python-version=3.12"
          - "--ignore-missing-imports"
          - "--no-strict-optional"
          - "."  # 添加当前目录作为目标
        pass_filenames: false
        always_run: true
